name: Quality

on:
  pull_request:
  push:
    branches: [main, feat/core-pilot]

jobs:
  quality:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/coach_tenand_test
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/coach_tenand_test
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: coach_tenand_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d coach_tenand_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm prisma generate
      - run: pnpm prisma migrate deploy
      - run: pnpm test
      - run: pnpm test:integration:pg
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e:pilot
      - run: pnpm lint
      - run: pnpm typecheck
